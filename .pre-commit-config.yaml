repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Lint with Ruff (Docker, matching CI)
        language: system
        entry: >-
          sh -c 'docker build -t my-app -f ./Dockerfile.dev . &&
          docker run -v "$(pwd):/app" -w /app --rm my-app ruff check'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
